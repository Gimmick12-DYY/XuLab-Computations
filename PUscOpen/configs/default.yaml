# -----------------------------------------------------------------------------
# PUscOpen: positive-unlabeled-aware, mask-restricted scOpen pipeline.
#
# Step summary:
#   00_inspect_rds.R          read-only sanity check on the .rds
#   01_export_rds_to_mm.R     .rds -> Matrix Market + region/cell TSVs
#   02_build_mask.R           build geometric candidate mask from cCREs +
#                             optional CTCF motif BED + blacklist exclusion;
#                             emit per-bin features for the PU classifier
#   03_pu_classifier.py       Elkan-Noto PU model on per-bin features; emit
#                             per-bin probability + refined mask + held-out
#                             positive set for step 07 validation
#   04_run_scopen.py          restrict matrix to refined-mask bins, run scOpen
#   05_postfilter.py          reconstruct W@H, apply neighborhood-consistency
#                             rule, optionally multiply by PU score
#   06_impute.py              persist <work>/impute/{matrix.npy, regions.tsv,
#                             barcodes.tsv, meta.json}
#   07_validate.py            recall/precision on held-out positives vs random
# -----------------------------------------------------------------------------

paths:
  input_rds:   /work/users/d/y/dyy12/XuLab/data/CTCF_bin1000_mtx.rds
  work_dir:    /work/users/d/y/dyy12/XuLab/PUscOpen/work/ctcf

  # Reuse the cached annotation BEDs that downstream/prepare_pos_neg_bins.R
  # already downloads. If you have a fresh tree, point this at any directory
  # containing the same file names (or run prepare_pos_neg_bins.R once).
  annotation_dir: /work/users/d/y/dyy12/XuLab/downstream/cache

  # Optional path to pos_neg_bins.tsv for *debug only*. Do **not** put benchmark
  # true negatives into the biological mask: they are controls for evaluation,
  # not part of the CTCF / cCRE hypothesis space. Full-mm CSR padding (step 06)
  # already gives downstream a fair row for every bin without training on neg.
  benchmark_bins_tsv: null

# -----------------------------------------------------------------------------
# Stage 1 -- geometric candidate mask (step 02_build_mask.R)
# -----------------------------------------------------------------------------
mask:
  # Which annotations to fold into the mask. Each is OR-combined; if *all*
  # use_* flags are false the mask is the full genome minus the blacklist.
  use_cCRE_293T:   true     # bins overlapping any HEK293T cCRE (any class)
  use_cCRE_293T_CA: true    # restrict 293T to CA classes (chromatin accessible)
  use_cCRE_CTCF:   true     # bins overlapping any GRCh38-cCREs.CTCF-bound entry
  use_motif:       false    # require a CTCF motif hit (needs motif_bed)
  motif_bed:       null     # e.g. JASPAR CTCF FIMO hits BED; null disables
  exclude_blacklist:  true  # remove blacklist bins from the mask
  # Optional mappability mask: path to a BED of low-mappability regions to
  # exclude. Leave null if you don't have one.
  exclude_mappability_bed: null

  # ----- Optional richer per-bin features (auto-skipped if unavailable) -----
  # GC content: provide a BSgenome package name OR a FASTA path. Skipped if
  # the package isn't installed or the file doesn't exist.
  gc_bsgenome:        null   # e.g. "BSgenome.Hsapiens.UCSC.hg38"
  gc_fasta_path:      null   # e.g. "/path/to/hg38.fa"
  # Mean mappability per bin from a bigWig file (needs rtracklayer).
  mappability_bigwig: null   # e.g. "/path/to/wgEncodeCrgMapabilityAlign100mer.bigWig"

  # Rarely: OR specific benchmark labels into mask_keep (e.g. a held-out pos
  # list). Leave empty — do not add random negatives here.
  union_benchmark_labels: []

  # Known-positive seed for the PU classifier. Same recipe as
  # Bin_posVSneg.ipynb: top-N HEK293 CTCF cCREs (by 293 CTCF z-score),
  # restricted to HEK293T-CA.
  positive_seed:
    n_top:        10000
    require_293T_CA: true

# -----------------------------------------------------------------------------
# Stage 2 -- PU classifier (step 03_pu_classifier.py)
# -----------------------------------------------------------------------------
pu:
  # Features fed to the classifier. Every name must exist as a column in
  # bin_features.tsv (written by step 02). Numeric columns are used as-is;
  # boolean columns become 0/1. Unknown columns raise; missing values become 0.
  features:
    - in_cCRE_293T
    - in_cCRE_293T_CA
    - in_cCRE_CTCF
    - motif_hit_count
    - ctcf_zscore_max         # NaN -> filled with 0
    - log10_total_count
    - log10_n_cells_observed
    # Richer signal/context features (added in step 02; gracefully NaN
    # if upstream data is missing).
    - log10_max_count
    - fraction_cells_observed
    - dist_log_top_CTCF
    - dist_log_cCRE_293T_CA
    - dist_log_cCRE_CTCF
    - n_top_CTCF_within_50kb
    - n_cCRE_293T_within_5kb
    - n_cCRE_CTCF_within_50kb
    # Optional features -- columns are written by step 02 but values may be
    # NaN if the source (FASTA / BSgenome / mappability bigWig) is unset.
    - gc_content
    - mappability_mean
    - is_chrX
    - is_chrY

  # Classifier choice. "logistic" is fast and well-calibrated; "rf" is more
  # expressive but slower and less calibrated.
  classifier:        logistic   # one of: logistic, rf
  random_state:      42
  cv_folds:          5
  hold_out_fraction: 0.20       # 20 % of seed positives held out for step 07

  # Threshold used by step 04 to decide which bins make the refined mask.
  # Supported forms:
  #   * "auto"               -> median PU score of seed positives (legacy,
  #                              tends to over-prune since seed scores cluster
  #                              near 1.0)
  #   * "top_k:<N>"          -> retain the top N bins by PU score within the
  #                              geometric mask (random tie-break w/ seed=42)
  #   * "quantile:<q>"       -> q-th quantile of pu_score over mask_keep
  #                              (e.g. quantile:0.95 keeps top 5%)
  #   * "seed_quantile:<q>"  -> q-th quantile of pu_score over seed positives
  #                              (e.g. seed_quantile:0.05 keeps everything
  #                              above the 5th percentile of seed scores)
  #   * <float>              -> fixed numeric threshold on pu_score
  # Default: top_k:50000 -> ~16x larger refined universe than the legacy
  # "auto" recipe in our HEK293T benchmark.
  refined_mask_threshold: "top_k:50000"

  # If true, union benchmark negatives into refined_mask (not recommended:
  # pollutes PU/scOpen with non-candidate genome). Keep false.
  force_include_benchmark_negatives: false

# -----------------------------------------------------------------------------
# Stage 3 -- scOpen on refined mask (step 04_run_scopen.py)
# -----------------------------------------------------------------------------
scopen:
  # Legacy knee-based rank estimation. Disabled by default in favour of the
  # explicit rank_sweep below, which is more robust to the kl.knee=None bug.
  estimate_rank:    false
  min_n_components: 5
  max_n_components: 30
  step_n_components: 5
  n_components:     50          # used when estimate_rank: false AND no rank_sweep
  # Bumping alpha is the cleanest tuning lever against over-imputation
  # *within* the refined mask. 1.0 is the scOpen paper default; try 2-3
  # to be more conservative. Slightly >1 spreads NMF mass a bit (helps weak
  # bins) while still controlling runaway peaks vs alpha=1.
  alpha:            1.25
  max_iter:         500
  init:             nndsvd
  random_state:     42
  nc:               6
  verbose:          0

  # Rank sweep -- run scOpen at each k and pick the best by held-out
  # AUROC (using PU's holdout_positives.tsv as the gold standard). Set to
  # null/empty to disable and use a single n_components run.
  rank_sweep: [30, 50, 80, 120]

  # Continuous PU row weighting (item 3 in PUscOpen tuning plan). When
  # true, every bin's nonzero counts are multiplied by a per-row integer
  # scale derived from (pu_score + row_weight_floor)**row_weight_alpha,
  # clipped to [1, row_weight_scale_max]. Default values keep low-PU
  # bins at scale=1 (they still participate) and boost high-PU bins up
  # to scale=row_weight_scale_max.
  row_weight_by_pu:     true
  row_weight_alpha:     1.0
  row_weight_floor:     0.05
  # Cap how aggressively high-PU rows are up-weighted during training; lower
  # -> less "winner-take-all" factorisation (moderates extreme peaks).
  row_weight_scale_max: 4

# -----------------------------------------------------------------------------
# Stage 4 -- neighborhood post-filter (step 05_postfilter.py)
# -----------------------------------------------------------------------------
postfilter:
  # Apply a CTCF-aware neighborhood rule: a bin gets to keep its imputed
  # signal only if at least min_neighbors bins within +/- neighborhood_bp on
  # the same chromosome also have imputed signal > neighbor_threshold (a
  # quantile of the per-bin imputed total; "auto" = median of pos-overlapping
  # bins).
  # Slightly wider window helps diffuse / low-coverage CTCF valleys borrow
  # support from nearby enriched bins without changing min_neighbors.
  neighborhood_bp:    12000
  min_neighbors:      1
  neighbor_threshold: auto

  # Damping mode (item 4 in PUscOpen tuning plan).
  #   soft_damp: true  -> continuous factor in [damp_floor, 1.0] based on
  #                       neighbour count and own-signal. No bin is fully
  #                       zeroed; previously-zeroed bins now keep at least
  #                       damp_floor of their imputed value.
  #   soft_damp: false -> hard rule: keep at 1.0 if supported, otherwise
  #                       damp by damp_unsupported (legacy 0.25).
  soft_damp:             true
  # Higher floor retains more mass on bins with weak neighbourhood support
  # (addresses "only tall peaks survive" in BigWig / complexity_gain).
  damp_floor:            0.72
  damp_unsupported:      0.25
  # Saturate neighbour support at 1 neighbour (was 2): modest bins reach full
  # damp sooner when they sit near a peak cluster.
  soft_neighbor_target:  1

  # Multiplicative PU prior on the final per-(bin, cell) signal.
  # Continuous form (item 3): damp *= clip(pu_score^pu_weight_alpha,
  # pu_weight_floor, 1). Set pu_weight_alpha=0 to disable; larger alpha
  # behaves more like a hard mask.
  multiply_by_pu:        true
  # <1 softens PU shrinkage on ambiguous bins; floor keeps a minimum weight.
  pu_weight_alpha:       0.55
  pu_weight_floor:       0.08

# -----------------------------------------------------------------------------
# Stage 5 -- persistence (step 06_impute.py)
# -----------------------------------------------------------------------------
impute:
  scale_factor: 1000000   # per-cell sum target after rescale
  # When true: write regions.tsv = full mm/regions.tsv(.gz) row order and
  # matrix_csr.npz = CSR float32 of shape (n_mm_bins, n_cells) with nonzeros
  # only on refined rows (fair to downstream compare_pos_neg / sensitivity).
  # When false: legacy compact matrix.npy + regions.tsv (refined rows only).
  align_to_mm: true
