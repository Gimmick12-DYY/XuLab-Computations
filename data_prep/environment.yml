name: data_prep
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pip
  - numpy
  - scipy
  - pandas
  - pyyaml
  - bedtools>=2.30
  - pip:
    - macs2>=2.2
  - samtools
  - r-base>=4.3
  - r-matrix
  - r-optparse
# Notes:
#   - macs2 is installed via pip (not bioconda): conda-built wheels fail on
#     RHEL9 / glibc 2.34+ with "undefined symbol: __log_finite".
#   - bedtools intersect is the only bedtools subcommand used; any v2.x is fine.
