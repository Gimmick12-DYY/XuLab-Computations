name: data_prep
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pip
  - numpy
  - scipy
  - pandas
  - pyyaml
  - bedtools>=2.30
  - pip:
    - macs3>=3.0
  - samtools
  - r-base>=4.3
  - r-matrix
  - r-optparse
# Notes:
#   - macs3 is the next-gen Python rewrite of MACS2: faster, better-maintained,
#     same CLI for `callpeak`. Installed via pip to dodge the conda-built
#     wheels' RHEL9 / glibc 2.34+ "undefined symbol: __log_finite" issue.
#   - bedtools intersect is the only bedtools subcommand used; any v2.x is fine.
