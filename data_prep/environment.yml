# -----------------------------------------------------------------------------
# MERGED INTO `cistopic`  (see cisTopic/environment.yml).
#
# The former `data_prep` env (macs3 + bedtools + samtools + R) is now a subset
# of the `cistopic` env, which serves as the single universal CPU analysis env
# for cisTopic, the cascades, and ALL of downstream/ (peak_coverage,
# prepare_pos_neg_bins desert mode, build_peak_matrix, ...). This removes the
# recurring "tool X not on PATH in this env" breakage.
#
# Create that env instead:
#     conda env create -f cisTopic/environment.yml      # name: cistopic
#
# Every sbatch that used to default to CONDA_ENV=data_prep now defaults to
# cistopic. This file is kept only as a signpost (not used to build anything).
# -----------------------------------------------------------------------------
name: cistopic
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
