# -----------------------------------------------------------------------------
# Default configuration for the cisTopic TF-imputation pipeline.
# Paths are placeholders -- edit before running on your cluster.
# Every parameter may also be overridden on the command line with --<name>.
# -----------------------------------------------------------------------------

paths:
  # Input R object: sparse regions x cells matrix (e.g. CTCF_bin1000_mtx.rds)
  input_rds:   /work/users/d/y/dyy12/XuLab/data/CTCF_bin1000_mtx.rds

  # Where the pipeline writes intermediate and final outputs.
  work_dir:    /work/users/d/y/dyy12/XuLab/cisTopic/scripts/cistopic_ctcf

  # Path to the MALLET binary. Download once per cluster with:
  #   wget https://github.com/mimno/Mallet/releases/download/v202108/Mallet-202108-bin.tar.gz
  #   tar -xf Mallet-202108-bin.tar.gz
  mallet_path: /work/users/d/y/dyy12/XuLab/Mallet-202108/bin/mallet

# -----------------------------------------------------------------------------
# Region / cell pre-filtering
# -----------------------------------------------------------------------------
filter:
  # Goal: keep as many regions and cells as practical for MALLET training. Only
  # blacklist bins are always removed when exclude_blacklist is true; the knobs
  # below are minimal QC (drop empty rows/columns). Tighten min_cells_per_region
  # (e.g. 2) if LDA becomes unstable on your hardware.
  #
  # Reference counts (pre-blacklist, same matrix as in older comments):
  #   min_cells_per_region: 1 -> ~597k regions; 2 -> ~119k; 3 -> ~30k
  min_counts_per_region: 0
  # Regions must be non-zero in at least this many cells (nnz per row after
  # blacklist, before binarize). 1 = maximal vocabulary.
  min_cells_per_region: 0

  # After region filter + binarize, drop cells with fewer than this many open bins.
  # 1 = keep every cell that still has any signal.
  min_regions_per_cell: 1

  # If true, binarize the input matrix (any count -> 1) before LDA.
  # This is the standard cisTopic input; set false only if you have a good reason.
  binarize_input: true

  # ENCODE hg38 blacklist (same file + overlap rule as downstream/prepare_pos_neg_bins.R
  # and Bin_posVSneg.ipynb): drop any bin whose interval overlaps a blacklist region.
  exclude_blacklist: true

  # pycisTopic.create_cistopic_object() always drops rows with zero signal in every
  # cell (non_zero_rows). If true, step 02 instead builds the object without that
  # drop so LDA vocabulary = all matrix rows after blacklist/QC (e.g. ~2.8M bins).
  # MALLET time and RAM scale with vocabulary size — use only when you need it.
  keep_zero_bins: false
  # If null, use <XuLab>/downstream/cache/hg38-blacklist.v2.bed.gz (resolved from work_dir).
  blacklist_bed_gz: null
  blacklist_url: https://github.com/Boyle-Lab/Blacklist/raw/refs/heads/master/lists/hg38-blacklist.v2.bed.gz

# -----------------------------------------------------------------------------
# LDA (MALLET) parameters
# -----------------------------------------------------------------------------
# We are explicitly optimising for *more imputed bins per cell* (i.e. higher
# imp_complexity in downstream/complexity_gain.py). Directionally:
#   * FEWER topics (smaller K) -> each topic covers more regions on average
#     (sum_r phi[r,k] = 1, so smaller K = phi is spread across more regions per
#     topic), which means more regions get a moderate P(r|c) per cell.
#   * HIGHER alpha -> cells mix more topics, so the predictive distribution
#     touches more regions per cell.
#   * HIGHER eta -> topic-region distributions are flatter (each topic owns
#     more regions instead of a handful of peaky ones).
# These together push the LDA toward a "broad imputation" regime that recovers
# many dropouts per cell. If you instead need sharper topic-specific
# predictions, lower alpha + eta and raise K (see the old defaults above).
lda:
  # Include small K so selection can pick a broad model (more regions touched
  # per cell at moderate P(r|c)); large K retained for sharper fits.
  n_topics: [3, 5, 8, 12, 15, 20, 25, 30, 50, 100, 125, 150]

  alpha: 12        # slightly higher cell–topic mixing (was 10).
  alpha_by_topic: true
  eta: 0.15        # flatter topics over regions (was 0.1).
  eta_by_topic: false

  iterations: 600
  threads: 16
  random_seed: 555
  memory: 200G

# -----------------------------------------------------------------------------
# Model selection
# -----------------------------------------------------------------------------
select:
  # Must match 04_select_model.py / pycisTopic: loglikelihood | arun_2010 | cao_juan_2009 | mimno_2011 | manual
  primary_metric: loglikelihood
  # Default to a small K so the imputed matrix is "broad" (more bins per cell).
  # Raise this if metrics indicate underfitting.
  manual_k: 5

# -----------------------------------------------------------------------------
# Imputation output (predictive distribution P(r|c) ~ phi @ theta)
#
# Step 05 thresholds the predictive distribution INSIDE the impute step and
# writes a sparse, full-mm-aligned imputed matrix that is a true drop-in
# replacement for the raw mm matrix (same shape, same row/col labels, sparse
# CSR storage). This lets the bigwig / browser workflow treat the imputed
# matrix exactly like the raw matrix.
#
# Outputs under <work>/impute/:
#   matrix_csr.npz   thresholded imputed values only (same shape as raw mm)
#   regions.tsv      full mm region order (same lines as mm/regions.tsv.gz)
#   barcodes.tsv     full mm barcode order (same lines as mm/barcodes.tsv.gz)
#   meta.json        threshold + origin + nnz + shape + rank_k + scale_factor
#   factors.npz      legacy phi + theta + per_cell_factor (saved iff
#                    drop_factors_npz is false; lets the downstream "factored"
#                    loader still reconstruct the raw P(r|c) without padding)
# -----------------------------------------------------------------------------
impute:
  scale_factor: 1000000

  # Per-pipeline threshold mode used INSIDE 05_impute.py. Same vocabulary as
  # downstream/complexity_gain.py:
  #   sparsity_match[:K]   Pick t so #(imp > t) ≈ K * raw_nnz on modeled rows.
  #   quantile:Q           Top (1 - Q) fraction of imputed values genome-wide.
  #                        Easier global cutoff (e.g. quantile:0.99): override on
  #                        CLI --threshold-mode quantile:0.99 for exploratory runs.
  #   fixed:T              Numeric.
  threshold_mode: sparsity_match:3

  # Random-sample size used to estimate the quantile threshold (4M is plenty).
  threshold_sample_size: 4000000

  # Pad the imputed matrix back to the full mm dimensions and align row/col
  # labels to mm/regions.tsv.gz + mm/barcodes.tsv.gz. true is the recommended
  # mode -- it makes the imputed CSR a drop-in for raw mm, browser tracks etc.
  align_to_mm: true

  # If true, store 1 instead of the raw imputed magnitude at every above-
  # threshold entry. Useful when you only want the "called positives" view.
  binarize_output: false

  # Skip writing the legacy factors.npz (saves disk; downstream still works
  # off matrix_csr.npz). Keep false unless you really don't want the soft
  # predictive distribution.
  drop_factors_npz: false

  # ---------------------------------------------------------------------
  # Neighbourhood propagation: fill in NEW (region, cell) entries at bins
  # that the LDA never modelled (because pycisTopic.create_cistopic_object
  # always strips all-zero rows -- LDA can't update phi for an unobserved
  # bin anyway). For each cell c we look at every bin r' that's still zero
  # in the imputed matrix; if at least min_neighbors imp-positive bins lie
  # within +/- window_bp on the same chromosome in cell c, we set
  #     imp[r', c] = weight * mean( imp[neighbour, c] )
  # This is the only mechanism that introduces *new* nonzero bins; without
  # it, "imputation" is just amplification of already-observed bins.
  #
  # window_bp     half-window for neighbour search (bp on each side).
  # min_neighbors per-cell minimum count of imp-positive neighbours required
  #               to propagate (raise -> more conservative).
  # weight        multiplier on the propagated value. < 1 marks the
  #               propagated entries as "softer evidence" than original
  #               imputed calls (which had weight 1).
  # target_bed    optional BED restricting propagation TARGETS to bins
  #               overlapping the BED (e.g. SCREEN cCREs). null = propagate
  #               to any bin within window of an imp-positive neighbour
  #               (broader; risks heterochromatin filling).
  # chunk_targets memory knob for the per-chromosome chunked solve.
  # ---------------------------------------------------------------------
  propagate:
    enabled:       true
    window_bp:     5000
    min_neighbors: 2
    weight:        0.5
    target_bed:    null
    chunk_targets: 5000
