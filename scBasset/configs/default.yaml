# -----------------------------------------------------------------------------
# Default configuration for the scBasset sequence-based imputation pipeline.
#
# scBasset (Yuan & Kelley, 2022, Nature Methods) is a CNN over DNA that predicts
# per-cell accessibility from sequence alone. At training time it learns:
#   sequence -> 32-d sequence embedding -> sigmoid(W_cell @ embed)
# where W_cell is a learnable (n_cells, 32) embedding. Crucially, the model
# can predict accessibility at ANY genomic bin once trained, so this is the
# ONLY pipeline that introduces signal at bins observed in zero cells.
#
# Pipeline shape (mirrors cisTopic / FITS / scOpen / MAGIC / PUscOpen / Cicero):
#   00_inspect_rds.R       sanity-check the input
#   01_export_rds_to_mm.R  RDS -> mm/{matrix.mtx.gz, regions.tsv.gz, barcodes.tsv.gz}
#   02_prepare_seqs.py     extract+one-hot-encode hg38 sequences for each bin
#   03_train.py            train scBasset (GPU)
#   04_predict.py          predict on ALL bins, threshold via sparsity_match
#   05_impute.py           assemble final mm-aligned CSR + meta
# -----------------------------------------------------------------------------

paths:
  # AllTF input. Two parallel RDS files share the same metadata; pick one
  # per run via this knob. The pair forms two comparison rows:
  #   bin matrix:  /work/.../data/TF1000cells.bin1000.mtx.rds
  #   peak matrix: /work/.../data/TF1000cells.pmat.mtx.rds
  input_rds:   /work/users/d/y/dyy12/XuLab/data/TF1000cells.bin1000.mtx.rds
  work_dir:    /work/users/d/y/dyy12/XuLab/scBasset/work/alltf_bin

  # hg38 FASTA + .fai (required for step 02). Fetch once:
  #   bash scripts/fetch_hg38_fasta.sh   # -> downstream/cache/hg38.fa
  genome_fa:   /work/users/d/y/dyy12/XuLab/downstream/cache/hg38.fa

  # Per-cell metadata. CSV (or TSV) with columns DNA_id, cell, TF, barcode,
  # subset. The `barcode` column (= "<DNA_id>:<cell>") must align with
  # mm/barcodes.tsv.gz. The model never reads this file; it is carried through
  # to downstream eval (downstream/eval_basic.py) so numbers can be stratified
  # by TF.
  cell_metadata: /work/users/d/y/dyy12/XuLab/data/TF1000cells.meta.csv

# -----------------------------------------------------------------------------
# Step 02: sequence extraction
# -----------------------------------------------------------------------------
seqs:
  # scBasset uses 1344bp centered windows. Our raw bins are 1kb; we pad
  # symmetrically by (seq_length - bin_size) / 2 = 172 bp each side.
  seq_length: 1344

  # Drop bins whose sequence contains > max_n_frac uppercase Ns.
  max_n_frac: 0.10

  # Only keep bins on these chromosomes (autosomes + chrX/Y by default;
  # set [] to disable the chrom filter).
  chrom_whitelist: [chr1, chr2, chr3, chr4, chr5, chr6, chr7, chr8, chr9, chr10,
                    chr11, chr12, chr13, chr14, chr15, chr16, chr17, chr18,
                    chr19, chr20, chr21, chr22, chrX, chrY]

  # ENCODE hg38 blacklist (same file the cisTopic / PUscOpen 02_build steps
  # use). Drop overlapping bins before sequence extraction.
  exclude_blacklist: true
  blacklist_bed_gz: null   # auto-discovered under <repo>/downstream/cache/

  # Minimum number of cells with raw > 0 for a bin to enter the *training*
  # subset. Prediction still happens on every kept bin (this is the whole
  # point of scBasset). 2 mirrors the Cicero default; raise for cleaner labels.
  min_cells_per_peak_train: 2

  # Optional explicit BED that limits the bins we even consider (training and
  # prediction). null = use every mm bin that passes the chrom + N filters.
  # Set this to a cCRE / motif BED to focus computation.
  bin_bed: null

  # Optional BED applied at PREDICTION time only (in 04_predict.py).
  #
  # IMPORTANT: motif BEDs are derived from BULK sources (JASPAR / HOCOMOCO /
  # bulk ChIP). Applying one here injects a bulk prior into a pipeline whose
  # whole point is to be data-only and TF-agnostic. Default is "off" so the
  # pipeline stays honest with that framing.
  #
  #   "off" (default) = no motif filter; predict on every bin in seqs.h5.
  #                     Use this for cross-pipeline imputation comparisons.
  #   null            = legacy auto-detect of
  #                     <repo>/downstream/cache/CTCF_motif_hg38.bed.
  #                     Opt-in only; introduces a bulk prior.
  #   "<path>"        = explicit BED path. Same caveat.
  predict_bed: "off"

# -----------------------------------------------------------------------------
# Step 03: model + training
# -----------------------------------------------------------------------------
model:
  latent_dim:    32            # scBasset paper default for the bottleneck.
  dropout_rate:  0.20
  l2:            0.0
  # Conv tower channel widths after the stem. Defaults mirror the paper's
  # geometric progression 288 -> 512.
  tower_channels: [288, 323, 363, 407, 456, 512]

train:
  batch_size:    64
  epochs:        500
  patience:      10            # early stopping on val loss.
  val_frac:      0.10          # held-out bin fraction.
  learning_rate: 1.0e-3
  random_seed:   555
  # Subsample cells during training (per epoch) for huge cell counts;
  # 0 = no subsampling.
  cells_per_step: 0
  # Save best weights by val_loss.
  save_best_only: true

# -----------------------------------------------------------------------------
# Step 04: prediction + thresholding
# -----------------------------------------------------------------------------
predict:
  batch_size:    256
  # Predict only the trainable bins (faster smoke test) or every kept bin
  # (recommended: this is where the "new bins" come from).
  predict_all_bins: true

  # Two-pass thresholding (same vocabulary as cisTopic / PUscOpen):
  #   sparsity_match:K     pick t so that #(pred > t) ~= K * raw_nnz
  #   quantile:Q           top (1 - Q) fraction of predictions
  #   fixed:T              numeric
  # sparsity_match:3 keeps the output comparable in scale to the other
  # imputers; raise K to be more aggressive about gaining bins.
  threshold_mode: sparsity_match:3
  threshold_sample_size: 4000000

# -----------------------------------------------------------------------------
# Step 05: persistence
# -----------------------------------------------------------------------------
impute:
  # If true, store 1 at every above-threshold entry; else store the sigmoid
  # probability. Binary is the cleanest drop-in for the raw matrix.
  binarize_output: true

  # Union with raw at the end so we never lose an observed entry.
  keep_raw: true

  # Multiplier on predicted values when binarize_output is false; ignored when
  # binarize_output is true.
  weight: 1.0
