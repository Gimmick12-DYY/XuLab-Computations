# -----------------------------------------------------------------------------
# scBasset (original 1344 bp / MaxPool chain) on the AllTF *peak* matrix.
#
# Use:  CFG=configs/alltf_peak.yaml sbatch slurm/99_full_pipeline.sbatch
#
# Pairs with configs/alltf_bin.yaml. Together they form the two scBasset
# rows in the four-run scBasset / scBasset_TF * peak / bin comparison.
# -----------------------------------------------------------------------------

paths:
  input_rds:     /work/users/d/y/dyy12/XuLab/data/TF1000cells_peaks_mtx.rds
  work_dir:      /work/users/d/y/dyy12/XuLab/scBasset/work/alltf_peak
  genome_fa:     /work/users/d/y/dyy12/XuLab/downstream/cache/hg38.fa
  cell_metadata: /work/users/d/y/dyy12/XuLab/data/TF1000cells.meta.tsv

seqs:
  seq_length:               1344    # scBasset paper default; held fixed for the original baseline.
  max_n_frac:               0.10
  chrom_whitelist:          [chr1, chr2, chr3, chr4, chr5, chr6, chr7, chr8, chr9, chr10,
                             chr11, chr12, chr13, chr14, chr15, chr16, chr17, chr18,
                             chr19, chr20, chr21, chr22, chrX, chrY]
  exclude_blacklist:        true
  blacklist_bed_gz:         null
  min_cells_per_peak_train: 2
  bin_bed:                  null
  predict_bed:              "off"   # Track A: no bulk-prior leak.

model:
  latent_dim:     32
  dropout_rate:   0.20
  l2:             0.0
  tower_channels: [288, 323, 363, 407, 456, 512]

train:
  batch_size:     64
  epochs:         500
  patience:       10
  val_frac:       0.10
  learning_rate:  1.0e-3
  random_seed:    555
  cells_per_step: 0
  save_best_only: true

predict:
  batch_size:            256
  predict_all_bins:      true
  threshold_mode:        sparsity_match:3
  threshold_sample_size: 4000000

impute:
  binarize_output: true
  keep_raw:        true
  weight:          1.0
