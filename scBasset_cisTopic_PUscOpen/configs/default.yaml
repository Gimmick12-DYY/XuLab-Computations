# -----------------------------------------------------------------------------
# scBasset+cisTopic ⊕ scBasset+PUscOpen   (cis-anchored, pus enhances)
#
# Combine two downstream pipelines into a final imputed CSR:
#   * scBasset_cisTopic/work/ctcf/impute    LDA-denoised + cisTopic union
#                                            -> the BACKBONE: every (bin, cell)
#                                               entry here is preserved
#   * scBasset_PUscOpen/work/ctcf/impute    scOpen NMF + neighborhood postfilter
#                                            -> the ENHANCER: boosts cis values
#                                               at overlapping entries; pus-only
#                                               entries are dropped
#
#     out[r, c] = cis[r, c] + w * pus_normalized[r, c]   if cis[r, c] > 0
#               = 0                                       otherwise
#
# This guarantees output ⊇ scbasset_cistopic at the (bin, cell) level --
# nothing the cisTopic side called is ever lost -- while pus signal
# differentiates strong (cis+pus) from weak (cis-only) entries.
# -----------------------------------------------------------------------------

sources:
  scbasset_cistopic_impute_dir: /work/users/d/y/dyy12/XuLab/scBasset_cisTopic/work/ctcf/impute
  scbasset_puscopen_impute_dir: /work/users/d/y/dyy12/XuLab/scBasset_PUscOpen/work/ctcf/impute

combine:
  # enhancer (default) -- cis-anchored. Every cis entry survives; pus boosts
  #                       cis values at overlapping entries; pus-only entries
  #                       are dropped.
  # max                -- legacy symmetric union. Element-wise max of both
  #                       sources; keeps pus-only entries too.
  method: enhancer

  # How strongly pus amplifies cis at overlapping entries (only used when
  # method == enhancer). 1.0 means an overlap entry has 1 + pus_normalized
  # (≈ 2 for typical pus_normalized ≈ 1) -- roughly 2x the cis-only height.
  # Bump to 2.0-5.0 for stronger contrast between cis-only and cis+pus
  # bins, drop to 0 to recover the raw scbasset_cistopic output.
  enhancer_weight: 1.0

  # Rescale each input's nonzeros to unit mean BEFORE combining. Without
  # this, scbasset_cistopic (binary, values=1) is dwarfed by scbasset_puscopen
  # (scOpen NMF floats, ~10^6 range) at every overlap. With normalize_inputs
  # true the enhancer's boost is in cis-comparable units, so peak heights
  # vary by both #cells observing the bin and the magnitude of the boost.
  normalize_inputs: true

  # Setting true erases per-(bin, cell) magnitude info -- the very thing the
  # enhancer mode is trying to preserve. Leave false unless you need a
  # strict 0/1 output for set logic.
  binarize_output: false

paths:
  work_dir: /work/users/d/y/dyy12/XuLab/scBasset_cisTopic_PUscOpen/work/ctcf
