# -----------------------------------------------------------------------------
# scBasset+cisTopic (backbone) + scBasset+PUscOpen (enhancer)
#
#     out[r, c] = cis[r, c] * (1 + w)   if cis[r, c] > 0 AND pus[r, c] > 0
#               = cis[r, c]              if cis[r, c] > 0 AND pus[r, c] = 0
#               = 0                      if cis[r, c] = 0
#
# Every (bin, cell) entry in scbasset_cistopic survives. Pus only modulates
# the cis values at overlapping entries (multiplies by 1+w). Pus-only
# entries are dropped.
#
# HARD invariant enforced at runtime: out.nnz == cis.nnz.
# -----------------------------------------------------------------------------

sources:
  scbasset_cistopic_impute_dir: /work/users/d/y/dyy12/XuLab/scBasset_cisTopic/work/ctcf/impute
  scbasset_puscopen_impute_dir: /work/users/d/y/dyy12/XuLab/scBasset_PUscOpen/work/ctcf/impute

combine:
  # Additive union: out = cis + w * pus_norm, where pus is first renormalised to
  # cis's total signal (pus_norm = pus * cis_total/pus_total). w =
  # enhancer_weight controls how much normalised pus contributes:
  #   1.0 (default) -> pus_norm carries the same total mass as cis
  #   0.5          -> pus contributes half
  #   0            -> pus disabled (output == cis exactly)
  # NOTE: pus-only entries are now ADDED (the old rule dropped them and kept
  # out.nnz == cis.nnz). Output nnz grows toward |cis ∪ pus|, so this matrix is
  # ~as dense as PUscOpen -- size 01_union + downstream RAM accordingly.
  enhancer_weight: 1.0

paths:
  work_dir: /work/users/d/y/dyy12/XuLab/scBasset_cisTopic_PUscOpen/work/ctcf
