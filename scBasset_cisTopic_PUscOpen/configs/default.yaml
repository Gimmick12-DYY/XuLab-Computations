# -----------------------------------------------------------------------------
# scBasset+cisTopic ∪ scBasset+PUscOpen   (additive union)
#
# Element-wise max of the two downstream-combined matrices:
#   * scBasset_cisTopic/work/ctcf/impute    LDA-denoised + cisTopic union
#   * scBasset_PUscOpen/work/ctcf/impute    scOpen NMF + neighborhood postfilter
#
# Both already contain scBasset's truly-new bins as their backbone, so the
# union preserves every call from either method:
#
#     out[r, c] = max(scbasset_cistopic[r, c], scbasset_puscopen[r, c])
#
# This is purely additive -- a (r, c) called by EITHER pipeline survives. No
# entries are dropped. Run both upstream pipelines first.
# -----------------------------------------------------------------------------

sources:
  scbasset_cistopic_impute_dir: /work/users/d/y/dyy12/XuLab/scBasset_cisTopic/work/ctcf/impute
  scbasset_puscopen_impute_dir: /work/users/d/y/dyy12/XuLab/scBasset_PUscOpen/work/ctcf/impute

combine:
  # Only `max` implemented.
  method: max

  # Rescale each input to unit mean-of-nonzeros BEFORE taking max. Without
  # this, scbasset_cistopic (binary, values=1.0) loses to scbasset_puscopen
  # (scOpen NMF floats, can reach ~10^6) at every overlap -- the union
  # becomes "puscopen wherever it fired". With normalize_inputs=true, each
  # input's typical nonzero is rescaled to 1.0, so peaks above each input's
  # own mean translate proportionally into the union and BigWig per-bin
  # sums show variable peak heights instead of a uniform picket fence.
  normalize_inputs: true

  # Default false. Setting true erases per-(bin, cell) magnitude information
  # so every nonzero looks identical in the IGV browser -- peaks all the
  # same height regardless of how many cells observed them or how confident
  # either source was. Leave false unless a strictly binary cross-source
  # call set is what you need.
  binarize_output: false

paths:
  work_dir: /work/users/d/y/dyy12/XuLab/scBasset_cisTopic_PUscOpen/work/ctcf
