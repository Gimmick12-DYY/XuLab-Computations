# -----------------------------------------------------------------------------
# scBasset + cisTopic (LDA-denoise + union)
#
# Pipeline:
#   1. cisTopic standalone runs on the RAW matrix and learns LDA topics that
#      reflect real biological co-accessibility (NOT scBasset's structure).
#      It produces W=phi (modeled_regions, K), H=theta (K, cells), and a
#      thresholded mm-aligned imputed matrix.
#   2. For each (r, c) in scBasset's output where r is in cisTopic's modeled
#      vocabulary, we compute the LDA-predicted probability
#          P(r | c)  =  phi[r, :] @ theta[:, c]
#      and KEEP the scBasset entry only if P(r|c) is in the top (1 - Q)
#      fraction of LDA scores for cell c (per-cell quantile threshold).
#   3. Bins in scBasset but NOT in cisTopic's vocabulary ("truly-new" bins,
#      zero in the raw matrix) are kept unchanged — LDA can't validate them
#      since it never saw them.
#   4. The filtered scBasset is unioned (element-wise max) with cisTopic's
#      standalone imputed matrix, so:
#        * cisTopic's denoised contributions are always included (additive)
#        * scBasset's predictions are only included if LDA validates them
#        * scBasset's truly-new bins are always included
# -----------------------------------------------------------------------------

sources:
  scbasset_impute_dir: /work/users/d/y/dyy12/XuLab/scBasset/work/ctcf/impute

  # Standalone cisTopic run (LDA on raw matrix). Must contain:
  #   factors.npz                W=phi, H=theta, per_cell_factor
  #   region_topic_phi.parquet   modeled bin names in the index
  #   cell_topic_theta.parquet   modeled cell barcodes in the columns
  #   matrix_csr.npz             mm-aligned imputed matrix (for the union step)
  #   regions.tsv / barcodes.tsv full mm region + barcode order
  cistopic_impute_dir: /work/users/d/y/dyy12/XuLab/cisTopic/scripts/cistopic_ctcf/impute

denoise:
  # LDA-based validation of scBasset's entries.
  #   off                  -> no filtering (pure union with cistopic; the
  #                            mildest possible choice — preserves every
  #                            scBasset peak)
  #   quantile:Q           -> per-cell threshold = Q-th percentile of LDA
  #                            scores over modeled bins for that cell. Keep
  #                            entries with P(r|c) >= T_c. Q in [0,1]:
  #                            higher Q = drops more scBasset entries.
  #   global_quantile:Q    -> single global threshold from a Q-th percentile
  #                            of all validatable scores
  #   fixed:T              -> keep entries with P(r|c) >= T (numeric)
  #
  # quantile:0.10 drops only the bottom 10% of scBasset entries per cell —
  # i.e. bins where LDA assigns extremely low probability. This keeps ~90%
  # of scBasset's LDA-vocabulary entries (and 100% of its truly-new bins).
  # If you still see too many scBasset peaks disappear, use mode: off.
  # Earlier default (quantile:0.5) dropped half the entries and visibly
  # erased scBasset peaks in IGV; quantile:0.10 is the gentler floor.
  mode: "quantile:0.10"

  # Per-cell quantile is estimated from a sample of LDA-modeled bins
  # (vs computing every score). 5000 is plenty for 100k+ modeled bins.
  threshold_sample_size: 5000

  # Truly-new bins (in scBasset, NOT in cisTopic's LDA vocabulary) cannot be
  # scored by LDA, so by default we keep them as-is. Set false to drop them.
  keep_truly_new_bins: true

combine:
  # After filtering, union with cisTopic's standalone imputed matrix
  # (element-wise max). When true the output is:
  #   LDA-filtered_scBasset  ∪  cisTopic_standalone
  # which is both "additive" (cisTopic's calls always survive) and "denoised"
  # (scBasset's calls only survive if LDA validates them).
  union_with_cistopic: true

  # Store 1.0 at every nonzero. scBasset and cisTopic use different value
  # scales so the union magnitudes are not meaningful anyway.
  binarize_output: true

paths:
  work_dir: /work/users/d/y/dyy12/XuLab/scBasset_cisTopic/work/ctcf
