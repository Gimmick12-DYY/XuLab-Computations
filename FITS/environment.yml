name: fits
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy
  - scipy
  - pandas
  - pyarrow
  - h5py
  - scikit-learn
  - matplotlib
  - seaborn
  - pyyaml
  - tqdm
  - r-base=4.4
  - r-matrix
  - r-optparse
  - bioconductor-singlecellexperiment
  - bioconductor-summarizedexperiment
  - r-seurat
  - pip:
      - MulticoreTSNE
  # FITSpython itself is cloned separately:
  #   git clone https://github.com/reggenlab/FITSpython
  # and `paths.fits_repo` in configs/default.yaml is pointed at the clone.
