# -----------------------------------------------------------------------------
# Default configuration for the FITS (Forest of Imputation Trees) TF imputation
# pipeline. Step 05 writes a compact dense-matrix output that the universal
# downstream/compare_pos_neg.py consumes directly; post-imputation analyses
# live under XuLab/downstream/.
# -----------------------------------------------------------------------------

paths:
  # Input R object: sparse regions x cells matrix (e.g. CTCF_bin1000_mtx.rds)
  input_rds:   /work/users/d/y/dyy12/XuLab/data/CTCF_bin1000_mtx.rds

  # Where the pipeline writes intermediate and final outputs.
  work_dir:    /work/users/d/y/dyy12/XuLab/FITS/work/ctcf

  # Local clone of FITSpython (https://github.com/reggenlab/FITSpython).
  fits_repo:   /work/users/d/y/dyy12/XuLab/FITS/FITSpython

# -----------------------------------------------------------------------------
# Pre-processing
# -----------------------------------------------------------------------------
filter:
  # FITS doesn't need cisTopic's `min_cells_per_region` quality filter; we
  # only keep binarisation because the dense CSV blows up otherwise.
  binarize_input: true

# -----------------------------------------------------------------------------
# FITS dense-input preparation
#
# FITS expects a dense CSV (rows = sites, cols = samples). The full ~3M region
# universe is intractable for FITS Phase1L's tree growth, so we pick a top-N
# subset directly from the input matrix.
# -----------------------------------------------------------------------------
prepare:
  # Region selection from the full input universe.
  #   "top_cells"  -> regions with the most nonzero cells (most informative)
  #   "top_counts" -> regions with the highest total signal
  #   "random"     -> random sample (seeded)
  region_selection: top_cells
  # Number of regions to feed to FITS. Set to null to disable subsetting and
  # try to run FITS on the entire matrix (likely intractable on CTCF).
  n_regions: 10000
  seed: 42

# -----------------------------------------------------------------------------
# FITS execution
# -----------------------------------------------------------------------------
fits:
  # "auto"  -> small (main_FITS1/2.py) when n_cells <= 3000, else large (FITSPhase1L/2L.py)
  # "small" -> force main_FITS1.py + main_FITS2.py
  # "large" -> force FITSPhase1L.py + FITSPhase2L.py
  large_mode: auto
  phase1_depth: 4
  phase1_output_prefix: FITS_OUTPUT

# -----------------------------------------------------------------------------
# Imputation output
#
# Step 05 writes <work>/impute/{matrix.npy, regions.tsv, barcodes.tsv, meta.json}.
# -----------------------------------------------------------------------------
impute:
  scale_factor: 1000000
