name: scopen
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.9          # scOpen tested through 3.9; safest target
  - pip
  # PyTables (tables) must match NumPy ABI; NumPy 2.x breaks older pytables wheels.
  - numpy>=1.24,<2
  - scipy
  - pandas
  - pyarrow
  - h5py
  - pytables           # required by scopen for 10Xh5 format support
  - scikit-learn
  - matplotlib
  - seaborn
  - pyyaml
  - tqdm
  - kneed              # rank elbow detection used by scopen --estimate_rank
  - r-base>=4.3
  - r-matrix
  - r-optparse
  - bioconductor-singlecellexperiment
  - bioconductor-summarizedexperiment
  - r-seurat
  - pip:
      - scopen
