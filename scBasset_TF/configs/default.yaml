# -----------------------------------------------------------------------------
# Default configuration for scBasset_TF — a TF-binding-focused fork of
# scBasset/ with two structural changes:
#
#   1. Adaptive / GlobalAvg pooling replaces the fixed MaxPool chain.
#      The architecture handles any `seq_length` without divisibility math.
#      Default seq_length drops from 1344 to 768 -- the original window is too
#      wide for TF-focused signal.
#   2. The pipeline runs over either a *peak* matrix (variable-width regions)
#      or a *bin* matrix (fixed 1 kb tiles). The mm/ contract is identical;
#      `input_kind` is recorded for downstream comparison only.
#
# What is intentionally preserved from scBasset/:
#   - Track A's data-only stance: `predict_bed: "off"` by default.
#   - The mm/ / seqs/ / model/ / predict/ / impute/ tier names.
#   - The Borzoi/scBasset evaluator wiring downstream.
#
# Pipeline shape:
#   00_inspect_rds.R       sanity-check
#   01_export_rds_to_mm.R  RDS -> mm/{matrix.mtx.gz, regions.tsv.gz, barcodes.tsv.gz}
#   02_prepare_seqs.py     center-extract `seq_length` bp per region
#   03_train.py            dilated tower + GlobalAvgPool, configurable length
#   04_predict.py          genome-wide prediction (no motif filter by default)
#   05_impute.py           assemble standard CSR schema
# -----------------------------------------------------------------------------

paths:
  # AllTF input. Two parallel RDS files share the same metadata. Pick one
  # per run via this knob; standard pair forms two comparison rows:
  #   bin matrix:  /work/.../data/TF1000cells_bin1000_mtx.rds
  #   peak matrix: /work/.../data/TF1000cells_peaks_mtx.rds
  input_rds:   /work/users/d/y/dyy12/XuLab/data/TF1000cells_peaks_mtx.rds
  work_dir:    /work/users/d/y/dyy12/XuLab/scBasset_TF/work/alltf_peak

  # hg38 FASTA + .fai (required for step 02). Reuse scBasset's fetched copy.
  genome_fa:   /work/users/d/y/dyy12/XuLab/downstream/cache/hg38.fa

  # Per-cell metadata TSV. Expected columns: DNA_id, cell, TF, barcode, subset.
  # `barcode` must match mm/barcodes.tsv.gz. Carried through to <work>/seqs/
  # but never enters the model loss; downstream eval uses the TF column to
  # stratify metrics per TF.
  cell_metadata: /work/users/d/y/dyy12/XuLab/data/TF1000cells.meta.tsv

# -----------------------------------------------------------------------------
# Run-level tags
# -----------------------------------------------------------------------------
run:
  # "peak" or "bin". Cosmetic / metadata-only; nothing in the code branches on
  # it. Recorded in meta.json files so cross-run comparisons can group results.
  input_kind:  peak

# -----------------------------------------------------------------------------
# Step 02: sequence extraction
# -----------------------------------------------------------------------------
seqs:
  # Window length, in bp. Defaults differ by input_kind because of bin-center
  # ambiguity: peaks come centered on a summit (narrow window is fine);
  # bins are arbitrary 1 kb tiles where the real TF binding event may be
  # anywhere inside or just outside the tile (wider window is safer).
  #
  #   input_kind = peak  ->  384  bp recommended (summit-centric)
  #   input_kind = bin   ->  1024 bp recommended (over-cover to defeat
  #                           bin-center misalignment)
  #
  # The architecture (GlobalAvgPool head) supports any value; nothing in the
  # layer math depends on this number. Tune per run.
  seq_length: 384

  # Drop regions whose centered window contains > max_n_frac uppercase Ns.
  max_n_frac: 0.10

  chrom_whitelist: [chr1, chr2, chr3, chr4, chr5, chr6, chr7, chr8, chr9, chr10,
                    chr11, chr12, chr13, chr14, chr15, chr16, chr17, chr18,
                    chr19, chr20, chr21, chr22, chrX, chrY]

  exclude_blacklist: true
  blacklist_bed_gz: null   # auto-discovered under downstream/cache/

  # Minimum cells with raw > 0 for a region to enter the training loss.
  # Sparser positive evidence -> noisier per-region label -> the model is
  # better off ignoring that region during training (but predictions still
  # run on every region for new-bin retrieval). Raised from scBasset's 2.
  min_cells_per_peak_train: 3

  # Optional explicit BED restricting candidate regions (training and
  # prediction). null = use every mm region passing the filters above.
  bin_bed: null

  # Prediction-time BED filter. Default "off" mirrors scBasset's Track A
  # framing -- motif BEDs are bulk-derived priors.
  predict_bed: "off"

# -----------------------------------------------------------------------------
# Step 03: model + training
# -----------------------------------------------------------------------------
model:
  latent_dim:    32
  dropout_rate:  0.20
  l2:            0.0

  # Stem keeps a single fixed downsample (MaxPool 3) so the dilated tower
  # operates at 1/3 the input resolution. Set to 1 to disable.
  stem_pool:     3
  stem_filters:  288
  stem_kernel:   17

  # Dilated conv tower replaces scBasset's 6-stage MaxPool chain. Each block:
  #   Conv1D(C, kernel=5, dilation=D, padding=same) -> BN -> GELU
  # Receptive field per output position at input scale:
  #   stem_kernel + 3 * (tower_kernel - 1) * sum(tower_dilations)
  # Defaults below give ~390 bp RF -- matches the peak default seq_length 384.
  # For wider windows (e.g. bin input at 1024 bp), extend dilations to
  # [2, 4, 8, 16, 32, 64] to keep RF >= seq_length.
  tower_channels:  [288, 323, 363, 407]
  tower_dilations: [2, 4, 8, 16]
  tower_kernel:    5

  # After the tower, a 1x1 conv projects to `head_filters` channels, then a
  # global pool collapses the (variable) spatial dim. global_max is the
  # right bias for sparse TF binding signal (motif hit anywhere -> firing
  # localized at that position); global_avg dilutes the motif signal across
  # all positions. global_avg is preferable for distributed accessibility
  # signal.
  head_filters: 256
  pool:         global_max     # global_max / global_avg

train:
  batch_size:    64
  epochs:        500
  patience:      10
  val_frac:      0.10
  learning_rate: 1.0e-3
  random_seed:   555
  cells_per_step: 0
  save_best_only: true

  # Loss function -- the sparsity attack.
  # ~99% of (region, cell) entries in single-cell TF data are zero. Plain BCE
  # is dominated by easy negatives; gradients at the rare 1s get washed out.
  #
  #   bce          : plain BCE. The scBasset paper default. Baseline only.
  #   bce_weighted : pos_weight * y * log(p) + (1-y) * log(1-p)
  #                  pos_weight: "auto" reads pos_weight_auto from
  #                              seqs/meta.json (= (1-pos_freq)/pos_freq)
  #                              or set a numeric value.
  #   focal        : Lin et al. 2017. (1 - p_t)^gamma down-weights easy
  #                  examples; alpha re-weights positives. Designed for the
  #                  exact extreme-class-imbalance regime we have here.
  #                  Recommended default.
  loss:         focal
  pos_weight:   auto       # only used when loss == bce_weighted
  focal_gamma:  2.0
  focal_alpha:  0.25

# -----------------------------------------------------------------------------
# Step 04: prediction + thresholding
# -----------------------------------------------------------------------------
predict:
  batch_size:    256
  predict_all_bins: true
  threshold_mode: sparsity_match:3
  threshold_sample_size: 4000000

# -----------------------------------------------------------------------------
# Step 05: persistence
# -----------------------------------------------------------------------------
impute:
  binarize_output: true
  keep_raw:        true
  weight:          1.0
