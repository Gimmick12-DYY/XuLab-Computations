# Cicero settings matched to Dr. Wang's RBBP4.conns.rds (Cell1000/cicero/RBBP4/),
# not the published snATACutils *defaults*.
#
# Evidence from his files (vs yal054/snATACutils paper defaults):
#   - all cells, not downsample-1000: his conns keep 53,772 / 53,825 pmat peaks
#     and 1.11M pairs; Jaccard 0.96 vs our all-cell 1 Mb run. Cell1000 = TFs
#     with >=1000 cells, and the pmat is 53,825 x ~181k.
#   - window 1 Mb, not 500 kb: 29% of gold .sel pairs span >500 kb (max 992 kb).
#   - k=10 and seed 2020 come from snapATAC.runCicero.R (untested on this pmat;
#     k=50/25 all-cell 1 Mb already failed to match scores).
#   - perm null = genBsp random bootstrap (snapATAC.runCicero.shuf.R), Gaussian
#     upper-tail p, BH FDR. Gold .sel used the perm para, not colShuf.
#
# paths.work_dir is overwritten per array task by the sbatch (--work-dir).
paths:
  work_dir: /work/users/d/y/dyy12/XuLab/cobinding/work/_placeholder

cicero:
  min_cells_per_peak: 1
  num_dim: 50
  k_metacell: 10          # snapATAC.runCicero.R make_cicero_cds(k=10)
  window_bp: 1000000      # his pairs go up to ~1 Mb, not the 500 kb default
  sample_num: 100
  max_cells: 0            # use all cells in the TF pmat (do not downsample)
  random_seed: 2020       # snapATAC.runCicero.R set.seed(2020)
  shuffle: none           # real run; sbatch can add --shuffle genbsp for the null
