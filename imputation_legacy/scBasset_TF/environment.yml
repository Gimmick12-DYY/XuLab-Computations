# -----------------------------------------------------------------------------
# MERGED INTO `scbasset`  (see scBasset/environment.yml).
#
# The `scbasset_tf` env was byte-identical to `scbasset` (same TensorFlow + R +
# samtools stack on Python 3.10). They are now one env: every scBasset_TF sbatch
# defaults to CONDA_ENV=scbasset.
#
# Create that env instead:
#     conda env create -f scBasset/environment.yml      # name: scbasset
#
# This file is kept only as a signpost (not used to build anything).
# -----------------------------------------------------------------------------
name: scbasset
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.10
